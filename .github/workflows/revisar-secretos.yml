# Revisa en cada push y pull request que no haya claves en el repo.
# Si falla, el PR muestra una X roja y no debe fusionarse.
name: Revisar secretos

on:
  push:
  pull_request:

jobs:
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar claves y tokens
        run: bash scripts/revisar_secretos.sh
